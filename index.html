
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantun Semangat Kerja ❤️</title>

<style>
body {
  background: #0d1117;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}

.box {
  border: 2px solid #f58ab6;
  border-radius: 20px;
  padding: 30px 20px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 25px #f58ab655;
}

h1 {
  color: #ff8fbd;
}

.pantun {
  font-size: 18px;
  line-height: 1.8;
  margin: 25px 0;
}

button {
  background: #f58ab6;
  border: none;
  padding: 13px 25px;
  border-radius: 25px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #e85c98;
}

.footer {
  color: #aaa;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>


<body>

<div class="box">
  <h1>☀️ Morning Sunshine!</h1>

  <p>Good morning, beautiful soul ❤️</p>

  <div class="pantun" id="pantun">
    Wake up and shine! ☀️<br><br>
    A new day, a new chance.<br>
    Keep smiling, keep going.<br>
    Believe in yourself.<br><br>
    Have a great day at work! 💪❤️
  </div>

  <button onclick="gantiPesan()">
    Click for a Smile 💌
  </button>

  <div class="footer">
    You can do amazing things.<br>
    Stay happy and keep shining! ❤️
  </div>
</div>

<script>
const pesan = [
`Take a deep breath. 🌸<br><br>
Forget yesterday's worries.<br>
Focus on today's opportunities.<br>
Do your best and enjoy the journey.<br><br>
Happy working! ❤️`,

`Good morning, sunshine! ☀️<br><br>
May your coffee be strong,<br>
your work be easy,<br>
and your day be wonderful.<br><br>
You got this! 💪`,

`One step at a time.<br><br>
Don't rush, don't give up.<br>
Your hard work will pay off.<br>
Keep believing in yourself.<br><br>
Have a lovely day! ❤️`,

`Smile a little more. 😊<br><br>
Work hard, stay positive,<br>
and don't forget to be happy.<br><br>
Sending you positive energy! 💕`
];

let index = 0;

function gantiPesan() {
  index = (index + 1) % pesan.length;
  document.getElementById("pantun").innerHTML = pesan[index];
}
</script>



</body>
</html>
