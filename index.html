
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantun Semangat Kerja ❤️</title>

<style>
body {
  background: #0d1117;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}

.box {
  border: 2px solid #f58ab6;
  border-radius: 20px;
  padding: 30px 20px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 25px #f58ab655;
}

h1 {
  color: #ff8fbd;
}

.pantun {
  font-size: 18px;
  line-height: 1.8;
  margin: 25px 0;
}

button {
  background: #f58ab6;
  border: none;
  padding: 13px 25px;
  border-radius: 25px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #e85c98;
}

.footer {
  color: #aaa;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="box">
  <h1>🌸 Semangat Kerja! 🌸</h1>

  <p>Untuk kamu yang sedang berjuang hari ini ❤️</p>

  <div class="pantun" id="pantun">
    Pergi ke pasar membeli jamu,<br>
    Pulangnya mampir membeli ketan.<br>
    Tetap semangat wahai dirimu,<br>
    Kerja yang ikhlas membawa keberuntungan.
  </div>

  <button onclick="gantiPantun()">
    Pantun Berikutnya 💌
  </button>

  <div class="footer">
    Jangan lupa tersenyum dan jangan menyerah! ❤️
  </div>
</div>

<script>
const pantun = [
`Pergi ke pasar membeli jamu,<br>
Jangan lupa membeli roti.<br>
Semangat kerja untuk dirimu,<br>
Semoga sukses menyertai hari ini.`,

`Burung merpati terbang ke awan,<br>
Hinggap sebentar di atas dahan.<br>
Jangan menyerah dalam pekerjaan,<br>
Hasil terbaik datang dari ketekunan.`,

`Pagi hari memetik melati,<br>
Melihat kupu-kupu menari.<br>
Tetap semangat sepenuh hati,<br>
Semoga lancar pekerjaan hari ini.`,

`Jalan-jalan ke Kota Blitar,<br>
Jangan lupa membeli sukun.<br>
Walau pekerjaan datang berputar,<br>
Tetap tersenyum dan jangan melamun.`,

`Beli mangga di pinggir jalan,<br>
Mangga manis rasanya legit.<br>
Tetap fokus dalam pekerjaan,<br>
Semoga rezekimu semakin melimpah dan berkah.`,

`Bunga mawar bunga selasih,<br>
Tumbuh indah di tepi taman.<br>
Kerja keras jangan bersedih,<br>
Setiap usaha punya masa depan.`
];

let index = 0;

function gantiPantun() {
  index = (index + 1) % pantun.length;
  document.getElementById("pantun").innerHTML = pantun[index];
}
</script>

</body>
</html>
